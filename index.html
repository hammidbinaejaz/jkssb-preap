<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="JKSSB PREP — Focused practice, mock tests, and progress tracking for JKSSB exams." />
  <title>JKSSB PREP</title>
  <link rel="stylesheet" href="./css/main.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
</head>
<body>
  <div id="site-nav"></div>
  <main class="container" id="main-content">
    <section class="hero">
      <p class="hero__brand">JKSSB PREP</p>
      <h1 class="hero__title">Serious preparation for serious exams.</h1>
      <p class="hero__sub">Practice by post, learn from mistakes, and improve where it counts — without the coaching-ad noise.</p>
      <div class="hero__actions">
        <a href="./pages/browse.html" class="btn btn--primary">Browse posts</a>
        <a href="./pages/practice.html" class="btn btn--secondary">Start practicing</a>
        <a href="./pages/mock.html" class="btn btn--ghost">Take a mock</a>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">How preparation works</h2>
      <div id="learning-loop-home"></div>
    </section>

    <section class="section" id="continue-section">
      <div class="continue-strip">
        <div>
          <p class="continue-strip__label">Continue prep</p>
          <p class="continue-strip__title" id="continue-label">Start your first practice session</p>
        </div>
        <a href="./pages/practice.html" id="continue-link" class="btn btn--primary">Continue</a>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">Featured categories</h2>
      <div id="home-categories" class="category-grid"></div>
    </section>
  </main>
  <div id="site-footer"></div>

  <script src="./js/utils.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      initPage({ pageTitle: 'Home', currentNav: 'Home' });
      UI.renderLearningLoop(document.getElementById('learning-loop-home'));

      const progress = loadProgress();
      if (progress.continueUrl) {
        document.getElementById('continue-link').href = progress.continueUrl;
        document.getElementById('continue-label').textContent = progress.continueLabel || 'Continue where you left off';
      } else {
        document.getElementById('continue-link').href = './pages/browse.html';
        document.getElementById('continue-label').textContent = 'Choose a post and begin';
      }

      const categoriesEl = document.getElementById('home-categories');
      try {
        await loadAllData();
        const categories = getCategories();
        if (!categories.length) {
          categoriesEl.appendChild(UI.EmptyState({
            title: 'Catalog not loaded',
            message: 'Categories will appear here once data/catalog.json is available.',
          }));
        } else {
          categories.forEach((cat) => {
            const postCount = (cat.posts || []).length;
            const questionCount = getCategoryQuestionCount(cat.id);
            categoriesEl.appendChild(UI.CategoryTile(cat, {
              href: pagesHref('browse.html', { category: cat.id }),
              postCount,
              questionCount,
            }));
          });
        }
      } catch (err) {
        categoriesEl.appendChild(UI.EmptyState({
          icon: '⚠️',
          title: 'Unable to load catalog',
          message: DataStore.loadError || 'Please try again later.',
        }));
      }
    });
  </script>
</body>
</html>
